<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="KitStak projects loader">
<style>
rect,path,circle{transform-box:fill-box}
/* 1 KitStak: the two bars trade places */
.k-top { animation: slideR 1.6s cubic-bezier(.65,0,.35,1) infinite; }
.k-bot { animation: slideL 1.6s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes slideR { 0%,100% { transform: translateX(-22px); } 50% { transform: translateX(22px); } }
@keyframes slideL { 0%,100% { transform: translateX(22px); } 50% { transform: translateX(-22px); } }

/* 2 Warehouse: boxes drop onto the shelves */
.box { animation: drop 2.8s infinite; }
.b1 { animation-delay: -1.5s; } .b2 { animation-delay: -1.4s; } .b3 { animation-delay: -1.3s; }
.b4 { animation-delay: -1s; } .b5 { animation-delay: -.9s; } .b6 { animation-delay: -.8s; }
@keyframes drop {
  0% { transform: translateY(-80px); opacity: 0; animation-timing-function: ease-in; }
  8% { opacity: 1; }
  18% { transform: translateY(0); animation-timing-function: ease-out; }
  22% { transform: translateY(-5px); animation-timing-function: ease-in; }
  26% { transform: translateY(0); }
  80% { transform: translateY(0); opacity: 1; }
  92%, 100% { transform: translateY(0); opacity: 0; }
}

/* 3 CRM and 4 Projects: bars grow in sequence */
.grow { animation: grow 2.4s infinite; transform-origin: center; }
.grow.left { transform-origin: left center; }
.g1 { animation-delay: -1s; } .g2 { animation-delay: -.78s; } .g3 { animation-delay: -.56s; }
@keyframes grow {
  0% { transform: scaleX(0); }
  6% { transform: scaleX(0); animation-timing-function: cubic-bezier(.34,1.4,.64,1); }
  22% { transform: scaleX(1); }
  78% { transform: scaleX(1); }
  92%, 100% { transform: scaleX(0); }
}

/* 5 People: head pops, shoulders rise */
.head { animation: pop 2.4s infinite; animation-delay: -1.1s; transform-origin: center; }
.body-s { animation: rise 2.4s infinite; animation-delay: -1.1s; }
@keyframes pop {
  0%, 8% { transform: scale(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  26% { transform: scale(1); }
  80% { transform: scale(1); }
  92%, 100% { transform: scale(0); }
}
@keyframes rise {
  0%, 5% { transform: translateY(46px); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  25% { transform: translateY(0); opacity: 1; }
  80% { transform: translateY(0); opacity: 1; }
  92%, 100% { transform: translateY(46px); opacity: 0; }
}

/* 6 Portal: four bars rotate around the grid */
.orb { animation: orbit 3.2s infinite; }
.o1 { animation-delay: 0s; } .o2 { animation-delay: -.8s; } .o3 { animation-delay: -1.6s; } .o4 { animation-delay: -2.4s; }
@keyframes orbit {
  0%, 20% { transform: translate(0,0); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  25%, 45% { transform: translate(68px,0); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  50%, 70% { transform: translate(68px,50px); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  75%, 95% { transform: translate(0,50px); animation-timing-function: cubic-bezier(.65,0,.35,1); }
  100% { transform: translate(0,0); }
}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="grow left g1" x="38" y="52" width="80" height="26" fill="#C8102E"/><rect class="grow left g2" x="68" y="87" width="80" height="26" fill="#D65A6E"/><rect class="grow left g3" x="98" y="122" width="64" height="26" fill="#C8102E"/>
</svg>
