<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="KitStak crew loader">
<style>
rect,polygon{transform-box:fill-box}
/* Crew (the brand pack's "People"): the head pops in above rising shoulders */
.head { animation: pop 2.4s infinite; animation-delay: -1.1s; transform-origin: center; }
.body-s { animation: rise 2.4s infinite; animation-delay: -1.1s; }
@keyframes pop {
  0%, 8% { transform: scale(0); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  26% { transform: scale(1); }
  80% { transform: scale(1); }
  92%, 100% { transform: scale(0); }
}
@keyframes rise {
  0%, 5% { transform: translateY(46px); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); }
  25% { transform: translateY(0); opacity: 1; }
  80% { transform: translateY(0); opacity: 1; }
  92%, 100% { transform: translateY(46px); opacity: 0; }
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<polygon class="head" points="70,44 130,44 100,96" fill="#D65A6E"/><polygon class="body-s" points="40,156 100,104 160,156 125.38,156 100,134 74.62,156" fill="#C8102E"/>
</svg>
