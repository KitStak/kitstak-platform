<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="KitStak pulse loader">
<style>
path{transform-box:fill-box}
/* Pulse: the two bars beat one after the other */
.beat { animation: beat 1.4s cubic-bezier(.65,0,.35,1) infinite; }
.b2 { animation-delay: .16s; }
@keyframes beat {
  0%, 46%, 100% { transform: translateY(0); }
  16% { transform: translateY(-9px); }
  30% { transform: translateY(2px); }
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<path class="beat" d="M40 70H84L100 54L116 70H160V98H115L100 83L85 98H40Z" fill="#C8102E"/><path class="beat b2" d="M40 114H85L100 99L115 114H160V142H40Z" fill="#D65A6E"/>
</svg>
